; ============================================================================
;  ProjetoQuartoEsp32 - PlatformIO
; ----------------------------------------------------------------------------
;  Este arquivo existe para que o PlatformIO:
;    1) instale/atualize as bibliotecas SOZINHO (secao lib_deps);
;    2) compile e grave o firmware direto na placa.
;
;  O codigo-fonte continua no formato de sketch do Arduino IDE (arquivos
;  .ino/.cpp/.h juntos na pasta ProjetoQuartoEsp32). Se um dia quiser voltar
;  para o Arduino IDE, basta abrir a pasta ProjetoQuartoEsp32.
;
;  COMO USAR (terminal na RAIZ do repositorio, ao lado deste arquivo):
;    pio run                 -> apenas compila (valida o codigo)
;    pio run -t upload       -> compila e grava na ESP32
;    pio run -t uploadfs     -> envia data/ (index.html) para o LittleFS
;    pio device monitor      -> abre o monitor serial (115200)
;    pio pkg update          -> atualiza plataforma e bibliotecas
;    pio pkg outdated        -> mostra o que esta desatualizado
;
;  Obs.: os comandos precisam ser executados na raiz do repositorio, porque e
;  aqui que o PlatformIO procura o platformio.ini (ele nao sobe pastas).
;
;  No VS Code: abra a pasta do repositorio (ProjetoAutomacaoEsp32) com a
;  extensao PlatformIO instalada e use os icones da barra inferior
;  (check = compilar, seta = gravar, plug = monitor serial).
; ============================================================================

[platformio]
; Pasta do sketch (formato Arduino IDE) usada como codigo-fonte do projeto
src_dir = ProjetoQuartoEsp32
; Pasta enviada para o LittleFS pelo comando 'pio run -t uploadfs'
data_dir = ProjetoQuartoEsp32/data
; Env usado por 'pio run' e pelos botoes da extensao do VS Code
default_envs = esp32dev
; Arquivo LOCAL com a senha do OTA (fica so no seu PC, fora do Git)
extra_configs = ota_senha.ini

; ============================================================================
;  SENHA DO OTA (gravacao pelo Wi-Fi)
; ----------------------------------------------------------------------------
;  A placa SEMPRE exige senha no OTA. A primeira senha e "senha".
;  Quando trocar a senha no painel (card "Configuracoes da placa"), troque
;  tambem no arquivo ota_senha.ini (ao lado deste). Ele NAO vai para o GitHub
;  (.gitignore) e, se existir, substitui o valor abaixo.
; ============================================================================
[ota]
password = senha

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
; Traduz os "Guru Meditation Error" do ESP32 em linha de codigo
monitor_filters = esp32_exception_decoder

; Sistema de arquivos usado pelo projeto (LittleFS)
board_build.filesystem = littlefs

; Bibliotecas instaladas/atualizadas automaticamente pelo PlatformIO
; (nomes exatamente como estao no registro: https://registry.platformio.org)
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    tzapu/WiFiManager @ ^2.0.17
    arduino-libraries/NTPClient @ ^3.2.1
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; ============================================================================
;  GRAVACAO SEM CABO (OTA) - espota
; ----------------------------------------------------------------------------
;    pio run -e esp32ota -t upload     -> firmware pelo Wi-Fi
;    pio run -e esp32ota -t uploadfs   -> pasta data/ (index.html) pelo Wi-Fi
;
;  Pre-requisitos: placa ligada na mesma rede e a regra de firewall liberando
;  o python.exe do PlatformIO (veja a secao "Gravando sem cabo (OTA)" do README).
; ============================================================================
[env:esp32ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = esp32.local
; Envia a senha do OTA (vem de ota_senha.ini ou do padrao [ota] acima)
upload_flags = --auth=${ota.password}
